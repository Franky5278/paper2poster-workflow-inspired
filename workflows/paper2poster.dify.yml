    - data:
        code: "def main(tree_split_results, figure_arrangement, images=None):\n    dpi = 25\n\n    id_to_url = {}\n    if images and isinstance(images, dict):\n        for k, v in images.items():\n            if isinstance(v, dict):\n                id_to_url[str(k)] = v.get(\"url\", \"\")\n            elif isinstance(v, str):\n                id_to_url[str(k)] = v\n\n    enriched = []\n    for fig in figure_arrangement:\n        fig_id = str(fig.get(\"figure_id\"))\n        fig_url = id_to_url.get(fig_id, \"\")\n        enriched.append({\n            \"panel_id\": fig[\"panel_id\"],\n            \"x\": fig[\"x\"],\n            \"y\": fig[\"y\"],\n            \"width\": fig[\"width\"],\n            \"height\": fig[\"height\"],\n            \"figure_id\": fig.get(\"figure_id\"),\n            \"figure_path\": fig_url,\n            \"figure_name\": fig_url.split(\"/\")[-1] if fig_url else \"\"\n        })\n\n    tree_split_results[\"figure_arrangement\"] = enriched\n    tree_split_results[\"figure_arrangement_inches\"] = [\n        {\n            \"panel_id\": f[\"panel_id\"],\n            \"x\": f[\"x\"] / dpi,\n            \"y\": f[\"y\"] / dpi,\n            \"width\": f[\"width\"] / dpi,\n            \"height\": f[\"height\"] / dpi,\n            \"figure_id\": f[\"figure_id\"],\n            \"figure_path\": f[\"figure_path\"],\n            \"figure_name\": f[\"figure_name\"]\n        } for f in enriched\n    ]\n\n    return {\n        \"tree_split_results_fixed\": tree_split_results\n    }\n"

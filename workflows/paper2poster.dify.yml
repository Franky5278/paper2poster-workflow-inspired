    - data:
        code: "import json\n\n# 假设这些变量是 Dify 代码节点直接传入的，无需 inputs.get()\n# text_and_image 是一个字符串，需要解析\n# total_text_len 是一个数字\n# image_data 现在直接是那个列表（即原 image_data[\"output_array\"] 的内容）\n# text_and_image_str = text_and_image # Dify 会直接传入变量，这里只是为了和之前的代码变量名一致\n# image_data_list = image_data # Dify 会直接传入变量，这里只是为了和之前的代码变量名一致\n\n\ndef main(text_and_image: str, text_len: int, image_data: list):\n    \"\"\"\n    Dify 代码节点的主函数，用于转换输入格式。\n\n    Args:\n        text_and_image (str): 包含 section 名称和 tp 值的 JSON 字符串。\n        text_len (int): 总文本长度。\n        image_data (list): 包含图片详细信息的列表，每个元素是一个字典。\n\n    Returns:\n        dict: 包含 'paper_panels' 列表的字典。\n    \"\"\"\n\n    # 1. 解析 text_and_image 字符串\n    try:\n        text_and_image_data = json.loads(text_and_image)\n    except json.JSONDecodeError:\n        raise ValueError(\"无法解析 text_and_image 字符串为 JSON。\")\n\n    # 2. 提取 image_data 中的图片尺寸信息，并构建一个方便查找的字典\n    image_dimensions = {}\n    for img in image_data: # 直接遍历 image_data 列表\n        image_dimensions[str(img.get(\"id\"))] = {\n            \"width\": img.get(\"width\"),\n            \"height\": img.get(\"height\")\n        }\n\n    # 3. 初始化 paper_panels 列表\n    paper_panels = []\n    panel_id_counter = 0\n\n    # 4. 遍历 text_and_image_data 来构建 panel\n    for section_name, section_info in text_and_image_data.items():\n        lens = text_len * section_info.get(\"tp\", 0.0)\n        panel = {\n            \"panel_id\": panel_id_counter,\n            \"section_name\": section_name,\n            \"tp\": section_info.get(\"tp\", 0.0),  # 确保tp存在，默认为0.0\n            \"text_len\": lens,  # text_len 对所有 panel 都是一样的\n            \"gp\": 0.0,  # 初始值，需要计算\n            \"figure_size\": 0.0,  # 初始值，需要计算\n            \"figure_aspect\": 0.0  # 初始值，需要计算\n        }\n\n        # 检查是否有图像与当前 section_name 相关联\n        image_id_in_section = section_info.get(\"image\")\n\n        if image_id_in_section:\n            img_id_str = str(image_id_in_section)\n            if img_id_str in image_dimensions:\n                img_width = image_dimensions[img_id_str].get(\"width\")\n                img_height = image_dimensions[img_id_str].get(\"height\")\n\n                if img_width is not None and img_height is not None and img_width > 0 and img_height > 0:\n                    # 计算 gp (图形占比) - 示例计算，可能需要调整比例因子\n                    # 你可能需要根据实际需求调整 gp 的计算方式\n                    panel[\"gp\"] = (img_width * img_height) / (text_len * 1000)\n\n                    # 计算 figure_size (图形面积)\n                    panel[\"figure_size\"] = float(img_width * img_height)\n\n                    # 计算 figure_aspect (图形宽高比)\n                    panel[\"figure_aspect\"] = float(img_width / img_height)\n                else:\n                    # 如果图片尺寸无效，则将 gp, figure_size, figure_aspect 设为0\n                    panel[\"gp\"] = 0.0\n                    panel[\"figure_size\"] = 0.0\n                    panel[\"figure_aspect\"] = 0.0\n            else:\n                # 如果 section 中有 image ID 但在 image_data 中找不到\n                panel[\"gp\"] = 0.0\n                panel[\"figure_size\"] = 0.0\n                panel[\"figure_aspect\"] = 0.0\n        else:\n            # 如果 section_info 中没有 'image' 字段\n            panel[\"gp\"] = 0.0\n            panel[\"figure_size\"] = 0.0\n            panel[\"figure_aspect\"] = 0.0\n\n        paper_panels.append(panel)\n        panel_id_counter += 1\n\n    # 返回结果\n    return {\n        \"paper_panels\": paper_panels\n    }\n\n# 在 Dify 代码节点中，你需要确保你的主逻辑被调用，并将其结果赋值给 outputs\n# Dify 会自动将 main 函数的返回值作为 outputs\n# 例如，如果你的代码节点将 \"text_and_image\", \"text_len\", \"image_data\" 作为输入，\n# Dify 会自动将它们作为参数传递给 main 函数。\n# 因此，你只需确保你的代码结构如上所示即可。"

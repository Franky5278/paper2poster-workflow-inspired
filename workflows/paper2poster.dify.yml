    - data:
        code: "import json\n\ndef main(data_list: list) -> list:\n    \"\"\"\n    计算输入列表中每个字典的'content'字段长度占总长度的比例，并添加'tp'键。\n\n    Args:\n        data_list (list): 包含待处理字典的列表，每个字典预期包含'content'键。\n\n    Returns:\n        list: 处理后的列表，每个字典元素包含计算出的'tp'值。\n    \"\"\"\n    total_content_length = 0\n    processed_list = []\n    # 首先计算所有有效content的总长度\n    for item in data_list:\n        if \"content\" in item and item[\"content\"] is not None:\n            total_content_length += len(item[\"content\"])\n\n    # 遍历每个元素，计算并添加tp值\n    for item in data_list:\n        if \"content\" in item and item[\"content\"] is not None:\n            # 计算比例并保留两位小数\n            item[\"tp\"] = round(len(item[\"content\"]) / total_content_length, 2)\n        else:\n            # 对于没有content或content为None的元素，tp设置为0.00\n            item[\"tp\"] = 0.00\n        if item[\"tp\"] > 0:\n            processed_list.append(item)\n    total_content_length = round(total_content_length)       \n    return {\"data_list\":processed_list,\n            \"text_len\":total_content_length\n    }"

    - data:
        code: "import re\n\ndef main(markdown_input: str) -> dict:\n    \"\"\"\n    将 markdown_input 文本切分为多个章节，并将每个章节的标题与内容组合成字符串返回。\n    \"\"\"\n    sections = []\n\n    # 更鲁棒的正则表达式\n    regex_pattern = r'(?m)^\\s*(?P<level>#+)\\s+(?P<title>[^\\n]+)\\n(?P<content>.*?)(?=\\n\\s*#|\\Z)'\n    matches = list(re.finditer(regex_pattern, markdown_input, flags=re.DOTALL))\n\n    if matches:\n        first_heading_index = matches[0].start()\n        if first_heading_index > 0:\n            preface = markdown_input[:first_heading_index].strip()\n            if preface:\n                sections.append(f\"Abstract/Introduction (Document Start)\\n\\n{preface}\")\n    else:\n        return {\n            \"result\": [markdown_input.strip()]\n        }\n\n    for match in matches:\n        title = match.group(\"title\").strip()\n        content = match.group(\"content\").strip()\n        sections.append(f\"{title}\\n\\n{content}\")\n\n    return {\n        \"result\": sections\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          result:
            children: null
            type: array[string]
        selected: false

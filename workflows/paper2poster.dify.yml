    - data:
        code: "import json\n\ndef main(llm_json_string: str) -> dict:\n    \"\"\"\n    解析输入的JSON字符串为一个字典，并移除所有章节中的'tp'字段。\n\n    Args:\n        llm_json_string (str): LLM输出的纯JSON字符串。\n\n    Returns:\n        dict: 移除了'tp'字段的Python字典。\n              如果解析失败，将打印错误信息并返回一个空字典。\n    \"\"\"\n    \n    parsed_data = {} # 初始化一个空字典用于存储解析结果\n    \n\n    parsed_data = json.loads(llm_json_string)\n    \n\n        # 2. 遍历字典，移除每个章节中的 'tp' 字段\n        # 检查 parsed_data 是否是字典类型，以防LLM输出意外格式\n    if isinstance(parsed_data, dict):\n        for section_name, section_info in parsed_data.items():\n                # 确保 section_info 也是一个字典，并且包含 'tp' 键\n            if isinstance(section_info, dict) and 'tp' in section_info:\n                del section_info['tp'] # 移除 'tp' 字段\n    parsed_data = {key: value \nfor key, value in parsed_data.items() if\n value != {}}\n    return {\"output_data\":parsed_data}"

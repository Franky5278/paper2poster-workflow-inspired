    - data:
        code: "import json\n\ndef main(output_data, paper_panels):\n    \"\"\"\n    整合 output_data 和 paper_panels 为一个 JSON Body，\n    自动修复没有 title 的情况，并将 figuree 的章节名统一为新版 section_name。\n    最终以 Dify 期望的字典格式返回输出。\n\n    Args:\n        output_data: 对应 Python 服务端 data[\"figures\"] 的数据。\n        paper_panels: 对应 Python 服务端 data[\"panels\"] 的数据。\n\n    Returns:\n        一个字典，其中包含键 'json_request_body'，\n        值是整合后的 JSON 字符串。\n    \"\"\"\n\n    # ✅ 1. 修复没有 title 的问题\n    has_title = any(\"title\" in p.get(\"section_name\", \"\").lower() for p in paper_panels)\n    if not has_title and paper_panels:\n        paper_panels[0][\"section_name\"] = \"Poster Title\"\n\n    # ✅ 2. 将旧章节名映射为新章节名（适配 layout 结果）\n    section_rename_map = {\n        \"Agent Construction\": \"Construction\",\n        \"Collaboration Mechanisms\": \"Collaboration\",\n        \"Agent Methodology\": \"Agent Methodology\",  # 如需映射可以加\n    }\n\n    cleaned_figuree = {}\n    for old_name, fig in output_data.items():\n        new_name = section_rename_map.get(old_name, old_name)\n        cleaned_figuree[new_name] = fig\n\n    # ✅ 3. 构造 JSON Payload\n    output_payload_for_service = {\n        \"figures\": cleaned_figuree,\n        \"panels\": paper_panels\n    }\n\n    json_string_to_send = json.dumps(output_payload_for_service)\n\n    return {\n        \"json_request_body\": json_string_to_send\n    }\n"

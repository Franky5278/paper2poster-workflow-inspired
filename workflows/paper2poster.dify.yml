    - data:
        code: "import json\nimport re\n\ndef main(llm_output_raw: str) -> dict:\n    \"\"\"\n    提取最后一个 </think> 后面的 JSON 内容。\n    如果没有 </think>，退而解析所有合法 JSON 并选最后一个。\n    总是返回一个包含 'result_json' 的字典。\n    \"\"\"\n\n    output_str = llm_output_raw.strip()\n    parsed_json_result = {}\n\n    # 尝试从最后一个 </think> 后提取内容\n    if \"</think>\" in output_str:\n        after_think = output_str.rsplit(\"</think>\", 1)[-1].strip()\n    else:\n        after_think = output_str\n\n    # 尝试匹配 Markdown 代码块\n    code_block_match = re.search(r'```(?:json)?\\s*(\\{.*?\\})\\s*```', after_think, re.DOTALL)\n    if code_block_match:\n        try:\n            parsed_json_result = json.loads(code_block_match.group(1))\n            return {\"result_json\": parsed_json_result}\n        except json.JSONDecodeError:\n            pass\n\n    # 查找所有 {...} 结构\n    all_json_candidates = re.findall(r'\\{.*?\\}', after_think, re.DOTALL)\n\n    for candidate in all_json_candidates:\n        try:\n            parsed_json_result = json.loads(candidate)\n            break  # 成功解析就返回\n        except json.JSONDecodeError:\n            continue\n\n    return {\"result_json\": parsed_json_result}"

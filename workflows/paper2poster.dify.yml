    - data:
        code: "import json\n\ndef main(raw_content, tree_split_results):\n     # 解包嵌套的 tree_split_results\n    if \"tree_split_results\" in tree_split_results:\n        tree_split_results = tree_split_results[\"tree_split_results\"]\n        \n    panels = tree_split_results['panels']\n    text_arrangement_list = tree_split_results['text_arrangement_inches']\n\n    processed_sections_data = []\n\n    # 从索引 1 开始遍历 raw_content['sections']\n    for i in range(1, len(raw_content['sections'])):\n        section_data = raw_content['sections'][i]\n        section_title = section_data['title']\n        summary_of_section = section_data['content']\n\n        # ✅ 使用 panel_id 匹配方式，防止越界\n        arrangement = next((p for p in panels if p['panel_id'] == i), None)\n        if arrangement is None:\n            continue  # 没找到对应的 panel_id，跳过该节\n\n        # 确定文本框数量\n        num_textboxes = 2 if arrangement['gp'] > 0 else 1\n\n        # 计算 total_expected_length\n        total_expected_length = 0\n        target_textboxes = [\n            t for t in text_arrangement_list if t['panel_id'] == i\n        ]\n\n        if len(target_textboxes) > 0:\n            target_textboxes.pop(0)  # 移除标题框\n\n        for text_arrangement in target_textboxes:\n            total_expected_length += text_arrangement['num_chars']\n\n        # 整理数据结构\n        processed_sections_data.append({\n            'section_index': i,\n            'section_title': section_title,\n            'summary_of_section': summary_of_section,\n            'num_textboxes': num_textboxes,\n            'total_expected_length': total_expected_length,\n            'target_textboxes': target_textboxes\n        })\n\n    return {\n        \"processed_sections_data\": processed_sections_data\n    }\n"

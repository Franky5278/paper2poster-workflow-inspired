    - data:
        code: "import json\nimport copy\nimport math\n\ndef main(mix_input, panell, figuree, imagee):\n    mix_input_json = json.loads(mix_input)\n    figures = figuree\n    panels = panell\n    panel_arrangement = mix_input_json['panel_arrangement']\n    figure_arrangement = mix_input_json[\"figure_arrangement\"]\n    text_arrangement = mix_input_json[\"text_arrangement\"]\n\n    # --- 修复处理 imagee 为 dict，并统一 key 为字符串 ---\n    result_dict = {}\n    for idx, item in enumerate(imagee):\n        if not isinstance(item, dict):\n            continue\n        item_id = item.get(\"id\")\n        if item_id is None:\n            continue\n        item_id = str(item_id)\n        value_data = item.copy()\n        value_data.pop(\"id\", None)\n        result_dict[item_id] = value_data\n    images = result_dict\n\n    # --- 工具函数定义 ---\n    def split_textbox(textbox, ratio):\n        total_ratio = ratio + 1\n        top_height = textbox['height'] * ratio / total_ratio\n        bottom_height = textbox['height'] * 1 / total_ratio\n        base_name = textbox['textbox_name'].rsplit('_t', 1)[0]\n\n        top_box = dict(textbox)\n        top_box['height'] = top_height\n        top_box['textbox_name'] = f\"{base_name}_t0\"\n\n        bottom_box = dict(textbox)\n        bottom_box['y'] = textbox['y'] + top_height\n        bottom_box['height'] = bottom_height\n        bottom_box['textbox_name'] = f\"{base_name}_t1\"\n\n        return top_box, bottom_box\n\n    def char_capacity(\n        bbox,\n        font_size_px=40 * (96 / 72),\n        *,\n        avg_width_ratio: float = 0.54,\n        line_height_ratio: float = 1,\n        padding_px: int = 0,\n    ) -> int:\n        CHAR_CONST = 10\n        _, _, height_px, width_px = bbox\n        usable_w = max(0, width_px - 2 * padding_px)\n        usable_h = max(0, height_px - 2 * padding_px)\n        if usable_w == 0 or usable_h == 0:\n            return 0\n\n        avg_char_w = font_size_px * avg_width_ratio\n        line_height = font_size_px * line_height_ratio\n        chars_per_line = max(1, math.floor(usable_w / avg_char_w))\n        lines = max(1, math.floor(usable_h / line_height))\n\n        return chars_per_line * lines * CHAR_CONST\n\n    def to_inches(value_in_units, units_per_inch=72):\n        return value_in_units / units_per_inch\n\n    def get_arrangments_in_inches(\n        width,\n        height,\n        panel_arrangement,\n        figure_arrangement,\n        text_arrangement,\n        units_per_inch=72\n    ):\n        panel_arrangement_inches = copy.deepcopy(panel_arrangement)\n        figure_arrangement_inches = copy.deepcopy(figure_arrangement)\n        text_arrangement_inches = copy.deepcopy(text_arrangement)\n\n        for p in panel_arrangement_inches:\n            p[\"x\"] = to_inches(p[\"x\"], units_per_inch)\n            p[\"y\"] = to_inches(p[\"y\"], units_per_inch)\n            p[\"width\"] = to_inches(p[\"width\"], units_per_inch)\n            p[\"height\"] = to_inches(p[\"height\"], units_per_inch)\n\n        for f in figure_arrangement_inches:\n            f[\"x\"] = to_inches(f[\"x\"], units_per_inch)\n            f[\"y\"] = to_inches(f[\"y\"], units_per_inch)\n            f[\"width\"] = to_inches(f[\"width\"], units_per_inch)\n            f[\"height\"] = to_inches(f[\"height\"], units_per_inch)\n\n        for t in text_arrangement_inches:\n            t[\"x\"] = to_inches(t[\"x\"], units_per_inch)\n            t[\"y\"] = to_inches(t[\"y\"], units_per_inch)\n            t[\"width\"] = to_inches(t[\"width\"], units_per_inch)\n            t[\"height\"] = to_inches(t[\"height\"], units_per_inch)\n\n        width_inch = to_inches(width, units_per_inch)\n        height_inch = to_inches(height, units_per_inch)\n        return width_inch, height_inch, panel_arrangement_inches, figure_arrangement_inches, text_arrangement_inches\n\n    # --- 主逻辑处理 ---\n    text_arrangement_title = text_arrangement[0]\n    text_arrangement = text_arrangement[1:]\n    top, bottom = split_textbox(text_arrangement_title, 0.8)\n    text_arrangement = [top, bottom] + text_arrangement\n\n        # ✅ 主动从 figures + panels 构造带图像路径的 figure_arrangement\n    figure_arrangement = []\n\n    for panel in panels:\n        section_name = panel.get('section_name', '')\n        panel_id = panel.get('panel_id')\n        figure_info = figures.get(section_name, {})\n\n        if 'image' in figure_info:\n            image_id = str(figure_info['image'])\n            image_url = images.get(image_id, {}).get('url', '')\n\n            if image_url:\n                figure_box = {\n                    'panel_id': panel_id,\n                    'x': panel.get('x', 0) + 5,   # 你可以根据需要微调坐标\n                    'y': panel.get('y', 0) + 5,\n                    'width': panel.get('width', 100) - 10,\n                    'height': panel.get('height', 100) / 2,\n                    'figure_path': image_url\n                }\n                figure_arrangement.append(figure_box)\n\n    for text_arrangement_item in text_arrangement:\n        num_chars = char_capacity(\n            bbox=(text_arrangement_item['x'], text_arrangement_item['y'], text_arrangement_item['height'], text_arrangement_item['width'])\n        )\n        text_arrangement_item['num_chars'] = num_chars\n\n    width_inch, height_inch, panel_arrangement_inches, figure_arrangement_inches, text_arrangement_inches = get_arrangments_in_inches(\n        1200, 900, panel_arrangement, figure_arrangement, text_arrangement, 25\n    )\n\n    tree_split_results = {\n        'poster_width': 1200,\n        'poster_height': 900,\n        'poster_width_inches': width_inch,\n        'poster_height_inches': height_inch,\n        'panels': panels,\n        'panel_arrangement': panel_arrangement,\n        'figure_arrangement': figure_arrangement,\n        'text_arrangement': text_arrangement,\n        'panel_arrangement_inches': panel_arrangement_inches,\n        'figure_arrangement_inches': figure_arrangement_inches,\n        'text_arrangement_inches': text_arrangement_inches,\n    }\n\n    return {\n        \"tree_split_results\": tree_split_results\n    }\n"

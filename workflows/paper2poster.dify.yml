          role: system
          text: "\n你需要根据图片的内容：{{#1751340061667.output#}}；\n和文章的全部文字及对应标题（section之后）：{{#context#}}，\n判断哪些图片和表格应该被保留，用于生成学术海报。你需要考虑以下几个因素：\n\n图片和表格的数量：海报通常会包含有限数量的图表，你需要保证选择的图表数量符合这一标准。\n\n图片和表格的内容相关性：你需要选择那些能够重点突出，与文章内容高度相关，有代表性的图表。\n\n图表与所属章节匹配：将保留下来的图片与其在论文全文中所属的章节标题（title）进行匹配。确保章节标题和提供的标题一致\n\n计算并累加文本比例 (tp)：tp 是一个浮点数，表示该章节的文本内容占全文总文本内容的比例。tp总和为1.\n\n请严格按照以下 JSON 格式输出，不需要输出你的思考部分，只输出 JSON。所有 key 必须是英文。\n\n输出格式:\n一个 JSON 对象，其中：\n\n键 (Key)：是论文章节的名称（title）。\n\n值 (Value)：是一个对象，包含以下内容：\n\n如果该章节包含一个要保留的图片，值为 {\"image\": image_id, \"tp\": text_proportion}，其中 image_id 是该图片在图片解析内容中的数字序号（数字类型），text_proportion 是该章节文本内容累加后的 tp（浮点数）。\n\n如果该章节没有保留的图片，值为 {\"tp\": text_proportion}。\n\n请确保 image_id 是数字类型。每个章节最多只保留一张图片。即使没有图片，只要有tp也应该保留。\n\n请确保title和提供的title一致\n\n请确保保留图片不超过三张\n\n**重要提示：请只输出JSON对象，不要在JSON前后添加任何额外文字、解释、注释或Markdown代码块标记（例如 ```json 或 ```）。**\n\n输出示例（只表示结构，无关内容）：\n{\n  \"Introduction\": {\"tp\": 0.12},  // 例如，如果最终的Introduction章节对应原始的Introduction章节\n  \"Methods\": {\"image\": 2, \"tp\": 0.25}, // 例如，如果最终的Methods章节对应原始的Methods章节\n  \"Results\": {\"image\": 3, \"tp\": 0.30}, // 例如，如果最终的Results章节对应原始的Results章节\n  \"Discussion\": {\"image\": 1, \"tp\": 0.20}, // 例如，如果最终的Discussion章节对应原始的Discussion章节\n  \"Conclusion\": {\"tp\": 0.13} // 例如，如果最终的Conclusion章节对应原始的Conclusion章节\n}"
